<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLANTROPA — Le Grand Œuvre</title>
<style>
  :root{
    --bg:#0e1114; --panel:#171b20; --panel2:#1f242b; --line:#2c333c;
    --ink:#e8e3d6; --dim:#9aa3ad; --gold:#c9a227; --gold2:#e6c65a;
    --red:#c0392b; --green:#5a9e5e; --blue:#4a8fb8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}

  #top{display:flex;align-items:center;gap:18px;padding:8px 14px;background:linear-gradient(180deg,#1d2229,#13171c);border-bottom:1px solid var(--line);flex:0 0 auto}
  #brand{font-family:Georgia,serif;font-size:19px;letter-spacing:.18em;color:var(--gold2)}
  #brand small{display:block;font-size:9px;letter-spacing:.28em;color:var(--dim)}
  .stat{display:flex;flex-direction:column;line-height:1.2;min-width:74px}
  .stat b{font-size:15px;font-variant-numeric:tabular-nums}
  .stat span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  #speed{margin-left:auto;display:flex;gap:4px;align-items:center}
  #speed .rate{font-size:9.5px;color:var(--dim);letter-spacing:.08em;margin-right:4px}
  button{font-family:inherit;font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer}
  button:hover:not(:disabled){background:#2b323b;border-color:#454e59}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.on{background:var(--gold);border-color:var(--gold2);color:#1a1508;font-weight:600}

  #main{display:flex;flex:1 1 auto;min-height:0}
  #mapwrap{flex:1 1 auto;position:relative;min-width:0;background:#05080b;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #side{flex:0 0 340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 4px;font-size:11px;letter-spacing:.05em;color:var(--dim)}
  #tabs button.on{background:var(--panel2);color:var(--gold2);box-shadow:inset 0 -2px 0 var(--gold)}
  .pane{display:none;padding:12px;overflow-y:auto;flex:1 1 auto}
  .pane.on{display:block}

  .sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:14px 0 7px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .sec:first-child{margin-top:0}
  .bar{margin:7px 0}
  .bar .lab{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
  .bar .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--dim)}
  .track{height:6px;background:#0c0f12;border-radius:3px;overflow:hidden}
  .fill{height:100%;transition:width .3s}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:9px;margin-bottom:8px}
  .card h4{margin:0 0 3px;font-size:12.5px;font-family:Georgia,serif}
  .card p{margin:0 0 6px;font-size:11px;color:var(--dim);line-height:1.45}
  .card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cost{font-size:11px;color:var(--gold2);font-variant-numeric:tabular-nums}
  .prog{height:4px;background:#0c0f12;border-radius:2px;margin-top:7px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--gold)}
  .tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:2px;background:#2a3039;color:var(--dim)}
  .tag.ok{background:#1e3a22;color:#8fd096} .tag.no{background:#3a1e1e;color:#e08b82}
  input[type=range]{width:100%;accent-color:var(--gold)}

  #log{flex:0 0 172px;background:#101418;border-top:1px solid var(--line);overflow-y:auto;padding:8px 12px;font-size:11.5px;line-height:1.5}
  #log div{margin-bottom:5px;padding-left:60px;position:relative;color:#c3cbd4}
  #log b{position:absolute;left:0;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
  #log div.bad{color:#e8a49b} #log div.good{color:#9ed3a3} #log div.big{color:var(--gold2);font-family:Georgia,serif;font-size:12.5px}

  .overlay{position:absolute;inset:0;background:rgba(6,9,12,.93);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
  .modal{max-width:660px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:5px;padding:26px 30px;max-height:88vh;overflow-y:auto}
  .modal h2{margin:0 0 4px;font-size:22px;color:var(--gold2)}
  .modal .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
  .modal p{line-height:1.62;color:#cfd6dd;font-size:13.5px}
  .modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  table.verdict{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}
  table.verdict td,table.verdict th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  table.verdict th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  table.verdict td:nth-child(2){color:var(--dim)} table.verdict td:nth-child(3){color:var(--gold2);font-variant-numeric:tabular-nums}

  /* --- contrôles carte --- */
  #layers{position:absolute;left:10px;top:10px;display:flex;gap:4px;background:rgba(14,17,20,.88);border:1px solid var(--line);border-radius:4px;padding:4px}
  #layers button{padding:4px 9px;font-size:11px}
  #mapopt{position:absolute;left:10px;top:48px;background:rgba(14,17,20,.88);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:11px;color:var(--dim);display:flex;gap:12px}
  #mapopt label{display:flex;align-items:center;gap:5px;cursor:pointer}
  #legend{position:absolute;left:10px;bottom:10px;background:rgba(14,17,20,.88);border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-size:10.5px;color:var(--dim);pointer-events:none;line-height:1.65;max-width:230px}
  #legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}
  #seaBadge{position:absolute;right:12px;top:12px;background:rgba(14,17,20,.9);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;padding:8px 13px;text-align:right}
  #seaBadge b{font-size:27px;font-family:Georgia,serif;font-variant-numeric:tabular-nums;display:block;line-height:1}
  #seaBadge span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  #zoomhint{position:absolute;right:12px;bottom:10px;font-size:10px;color:#5f6871;pointer-events:none}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#05080b;color:var(--dim);font-family:Georgia,serif;letter-spacing:.2em;z-index:60;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="brand">ATLANTROPA<small>INSTITUT DU GRAND ŒUVRE · MUNICH</small></div>
    <div class="stat"><b id="sYear">1930</b><span>Année</span></div>
    <div class="stat"><b id="sMoney">—</b><span>Trésor (Md)</span></div>

      <div id="legend"></div>
      <div id="zoomhint">molette : zoom · glisser : déplacer</div>
      <div id="boot"><div>CALCUL DU RELIEF ET DE LA BATHYMÉTRIE</div><div style="letter-spacing:.05em;font-family:Inter,sans-serif" id="bootmsg">…</div></div>
    </div>

    <div id="side">
      <div id="tabs">
        <button data-tab="ops" class="on">Chantiers</button>
        <button data-tab="env">Milieu</button>
        <button data-tab="geo">Nations</button>
        <button data-tab="doc">Dossier</button>
      </div>
      <div class="pane on" id="pane-ops"></div>
      <div class="pane" id="pane-env"></div>
      <div class="pane" id="pane-geo"></div>
      <div class="pane" id="pane-doc"></div>
    </div>
  </div>

  <div id="log"></div>
</div>

<div class="overlay" id="ov" style="display:none"><div class="modal" id="ovm"></div></div>

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(v,d=0)=>(isFinite(v)?v:0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
function chaikin(poly,iter){
  let p=poly;
  for(let k=0;k<iter;k++){
    const q=[];
    for(let i=0;i<p.length;i++){
      const a=p[i], b=p[(i+1)%p.length];
      q.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
      q.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
    }
    p=q;
  }
  return p;
}
const MED=chaikin(MED_,2), ATL=chaikin(ATL_,1), MARM=chaikin(MARM_,2), BLACK=chaikin(BLACK_,2);
const ISLANDS=ISL_.map(p=>chaikin(p,2));

/* Le bassin oriental est séparé de l'occidental par la ligne Cap Bon –
   Trapani puis le détroit de Messine. */
function isEast(lo,la){
  if(la>41.6) return lo>12.20;
  if(la>38.6) return lo>16.00;
  if(la>37.6) return lo>15.45;
  return lo > 11.05 + 1.61*(la-36.85);
}

/* ----------------------------------------------------------- LA GRILLE */
const isLand=new Uint8Array(N);
const depth =new Float32Array(N);
const elev  =new Float32Array(N);
const basin =new Uint8Array(N);
const expo  =new Int16Array(N);
const shade =new Float32Array(N);
const noise =new Float32Array(N);
let coastDist=new Float32Array(N);

/* Rasterisation par balayage de lignes : bien plus rapide qu'un test
   point-dans-polygone par cellule. */
function scanFill(poly,cb){
  for(let gy=0;gy<GH_;gy++){
    const la=gy2lat(gy); const xs=[];
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const yi=poly[i][1], yj=poly[j][1];
      if((yi>la)!==(yj>la)){
        const xi=poly[i][0], xj=poly[j][0];
        xs.push(xi+(la-yi)*(xj-xi)/(yj-yi));
      }
    }
    if(xs.length<2)continue;
    xs.sort((a,b)=>a-b);
    const row=gy*GW_;
    for(let k=0;k+1<xs.length;k+=2){
      let g0=Math.ceil((xs[k]-LON0)*PXDEG-0.5), g1=Math.floor((xs[k+1]-LON0)*PXDEG-0.5);
      if(g1<0||g0>GW_-1)continue;
      g0=Math.max(0,g0); g1=Math.min(GW_-1,g1);
      for(let gx=g0;gx<=g1;gx++) cb(row+gx,gx,gy,la);
    }
  }
}
function buildGrid(){
  basin.fill(0); expo.fill(-1);
  scanFill(MED,(i,gx,gy,la)=>{ basin[i]=isEast(gx2lon(gx),la)?3:2; });
  scanFill(BLACK,i=>basin[i]=4);
  scanFill(MARM,i=>basin[i]=4);
  scanFill(ATL,i=>basin[i]=1);
  for(const isl of ISLANDS) scanFill(isl,i=>basin[i]=0);
  for(let i=0;i<N;i++) isLand[i]=basin[i]?0:1;

  for(let gy=0;gy<GH_;gy++){ const la=gy2lat(gy);
    for(let gx=0;gx<GW_;gx++){ const lo=gx2lon(gx);
      noise[gy*GW_+gx]=(Math.sin(lo*137.7+la*91.3)*43758.5453)%1; } }

  // distance à la côte (chanfrein 2 passes)
  const INF=1e9;
  for(let i=0;i<N;i++)coastDist[i]=isLand[i]?0:INF;
  for(let y=0;y<GH_;y++)for(let x=0;x<GW_;x++){const i=y*GW_+x;let v=coastDist[i];
    if(x>0)v=Math.min(v,coastDist[i-1]+1); if(y>0)v=Math.min(v,coastDist[i-GW_]+1);
    if(x>0&&y>0)v=Math.min(v,coastDist[i-GW_-1]+1.414); if(x<GW_-1&&y>0)v=Math.min(v,coastDist[i-GW_+1]+1.414);
    coastDist[i]=v;}
  for(let y=GH_-1;y>=0;y--)for(let x=GW_-1;x>=0;x--){const i=y*GW_+x;let v=coastDist[i];
    if(x<GW_-1)v=Math.min(v,coastDist[i+1]+1); if(y<GH_-1)v=Math.min(v,coastDist[i+GW_]+1);
    if(x<GW_-1&&y<GH_-1)v=Math.min(v,coastDist[i+GW_+1]+1.414); if(x>0&&y<GH_-1)v=Math.min(v,coastDist[i+GW_-1]+1.414);
    coastDist[i]=v;}
  // même chose vers l'intérieur des terres
  const landDist=new Float32Array(N);
  for(let i=0;i<N;i++)landDist[i]=isLand[i]?INF:0;
  for(let y=0;y<GH_;y++)for(let x=0;x<GW_;x++){const i=y*GW_+x;let v=landDist[i];
    if(x>0)v=Math.min(v,landDist[i-1]+1); if(y>0)v=Math.min(v,landDist[i-GW_]+1);
    if(x>0&&y>0)v=Math.min(v,landDist[i-GW_-1]+1.414); if(x<GW_-1&&y>0)v=Math.min(v,landDist[i-GW_+1]+1.414);
    landDist[i]=v;}
  for(let y=GH_-1;y>=0;y--)for(let x=GW_-1;x>=0;x--){const i=y*GW_+x;let v=landDist[i];
    if(x<GW_-1)v=Math.min(v,landDist[i+1]+1); if(y<GH_-1)v=Math.min(v,landDist[i+GW_]+1);
    if(x<GW_-1&&y<GH_-1)v=Math.min(v,landDist[i+GW_+1]+1.414); if(x>0&&y<GH_-1)v=Math.min(v,landDist[i+GW_-1]+1.414);
    landDist[i]=v;}

  // bathymétrie et altimétrie
  for(let gy=0;gy<GH_;gy++){ const la=gy2lat(gy);
    for(let gx=0;gx<GW_;gx++){ const i=gy*GW_+gx, lo=gx2lon(gx);
      if(isLand[i]){
        let e=Math.min(900,landDist[i]*CELLKM*3.2);
        for(const r of RANGES){ const u=(lo-r[0])/r[2], v=(la-r[1])/r[3];
          const g=r[4]*Math.exp(-(u*u+v*v)); if(g>e)e=g; }
        elev[i]=e*(0.90+0.20*Math.abs(noise[i])); depth[i]=0;
      } else {
        let d=0;
        for(const b of BASINS){ const u=(lo-b[0])/b[2], v=(la-b[1])/b[3];
          const g=b[4]*Math.exp(-(u*u+v*v)); if(g>d)d=g; }
        d=Math.min(d,coastDist[i]*CELLKM*11+5);
        for(const s of SHOALS){ const u=(lo-s[0])/s[2], v=(la-s[1])/s[3];
          const w=Math.exp(-(u*u+v*v)); if(w>0.05) d=d*(1-w)+Math.min(d,s[4])*w; }
        // canyons sous-marins : rides fines pour donner du grain au relief noyé
        const rip=Math.sin(lo*7.3+la*5.1)*Math.sin(lo*3.1-la*9.7);
        depth[i]=Math.max(4,d*(0.96+0.08*Math.abs(noise[i]))+rip*Math.min(140,d*0.06));
        elev[i]=0;
      }
    }
  }
  buildShade();
}
/* Ombrage : lumière au nord-ouest, 45° */
function buildShade(){
  const H=new Float32Array(N);
  for(let i=0;i<N;i++) H[i]= isLand[i]? elev[i] : -depth[i];
  const px=CELLKM*1000, Z=9;
  const Lx=-0.5, Ly=-0.5, Lz=0.7071;
  for(let y=0;y<GH_;y++)for(let x=0;x<GW_;x++){
    const i=y*GW_+x;
    const xa=x>0?H[i-1]:H[i], xb=x<GW_-1?H[i+1]:H[i];
    const ya=y>0?H[i-GW_]:H[i], yb=y<GH_-1?H[i+GW_]:H[i];
    const gx=(xb-xa)/(2*px)*Z, gy=(yb-ya)/(2*px)*Z;
    const nx=-gx, ny=-gy, nz=1, len=Math.hypot(nx,ny,nz);
    const s=clamp((nx*Lx+ny*Ly+nz*Lz)/len,0,1)/Lz;   // 1 = terrain plat
    shade[i]=0.45+0.58*s;                             // 0,45 (ubac) … 1,26 (adret)
  }
}

function applyRates(){
  S.dropW = S.rBase*(1-S.turbine);
  S.dropE = S.built.sic ? S.rBaseE*(1-S.turbine*0.5) : S.dropW;
}
function measure(){
  let vW=0,vE=0,aW=0,aE=0,land=0,salt=0;
  for(let i=0;i<N;i++){
    const b=basin[i]; if(b!==2&&b!==3)continue;
    const lv=b===2?S.levelW:S.levelE, col=depth[i]+lv;
    if(col>0){ if(b===2){vW+=col;aW++;} else {vE+=col;aE++;} }
    else { land++; if(expo[i]>=0&&S.year-expo[i]>6)salt++; }
  }
  return {vW:vW*CELL_AREA,vE:vE*CELL_AREA,aW:aW*CELL_AREA,aE:aE*CELL_AREA,
          land:land*CELL_AREA/1e6, salt:salt*CELL_AREA/1e6};
}
function updateExposure(){
  for(let i=0;i<N;i++){ const b=basin[i]; if(b!==2&&b!==3)continue;
    const lv=b===2?S.levelW:S.levelE;
    if(depth[i]+lv<=0){ if(expo[i]<0)expo[i]=S.year; } else expo[i]=-1; }
}
const wdist=new Float32Array(N);
function waterDistance(){
  const INF=1e9;
  for(let i=0;i<N;i++){ const b=basin[i]; let w;
    if(b===1||b===4)w=true; else if(b===2)w=depth[i]+S.levelW>0;
    else if(b===3)w=depth[i]+S.levelE>0; else w=false;
    wdist[i]=w?0:INF; }
  for(let y=0;y<GH_;y++)for(let x=0;x<GW_;x++){const i=y*GW_+x;let v=wdist[i];
    if(x>0)v=Math.min(v,wdist[i-1]+1); if(y>0)v=Math.min(v,wdist[i-GW_]+1);
    if(x>0&&y>0)v=Math.min(v,wdist[i-GW_-1]+1.414); if(x<GW_-1&&y>0)v=Math.min(v,wdist[i-GW_+1]+1.414); wdist[i]=v;}
  for(let y=GH_-1;y>=0;y--)for(let x=GW_-1;x>=0;x--){const i=y*GW_+x;let v=wdist[i];
    if(x<GW_-1)v=Math.min(v,wdist[i+1]+1); if(y<GH_-1)v=Math.min(v,wdist[i+GW_]+1);
    if(x<GW_-1&&y<GH_-1)v=Math.min(v,wdist[i+GW_+1]+1.414); if(x>0&&y<GH_-1)v=Math.min(v,wdist[i+GW_-1]+1.414); wdist[i]=v;}
}
let baseStrand={};
function computeStrand(first){
  waterDistance();
  for(const c of CITIES){
    const gx=clamp(Math.round(lon2x(c.lo)),0,GW_-1), gy=clamp(Math.round(lat2y(c.la)),0,GH_-1);
    const km=wdist[gy*GW_+gx]*CELLKM;
    if(first)baseStrand[c.n]=km;
    S.strand[c.n]=Math.max(0,km-(baseStrand[c.n]||0));
  }
}

function log(t,cls){ S.log.unshift({y:S.year,t,cls:cls||''}); if(S.log.length>140)S.log.pop(); drawLog(); }
function drawLog(){
  document.getElementById('log').innerHTML=S.log.slice(0,50).map(e=>`<div class="${e.cls}"><b>${e.y}</b>${e.t}</div>`).join('');
}

/* --- Moteur --- */
let curDec=null, speedBefore=1, evCooldown=0;
function eligible(e){
  if(e.fy) return false;
  const f=S.fired[e.id];
  if(f!==undefined && !(e.rep && S.year-f>=e.rep)) return false;
  if(e.y && (S.year<e.y[0]||S.year>e.y[1])) return false;
  if(e.c && !e.c()) return false;
  return true;
}
function tryDecision(){
  if(S.ended||curDec)return;
  // 1. événements historiques imposés
  for(const e of DECISIONS){
    if(e.fy && S.fired[e.id]===undefined && S.year>=e.fy){ fire(e); return; }
  }
  if(evCooldown>0){ evCooldown--; return; }
  const pool=DECISIONS.filter(eligible);
  if(!pool.length)return;
  let tot=0; pool.forEach(e=>tot+=(e.p||1));
  let r=Math.random()*tot, pick=pool[0];
  for(const e of pool){ r-=(e.p||1); if(r<=0){pick=e;break;} }
  fire(pick);
  evCooldown=1+Math.floor(Math.random()*3);
}
function fire(e){
  S.fired[e.id]=S.year; curDec=e; S.decisions++;
  speedBefore=S.speed||1; S.speed=0; setSpeedBtn();
  showModal(`
    <div class="kicker">${S.year} · ${e.k} · décision n° ${S.decisions}</div>
    <h2>${e.t}</h2>
    <p>${e.x}</p>
    <div style="font-size:11px;color:#8c949e;border-top:1px solid #2c333c;margin-top:14px;padding-top:9px">
      Trésor ${fmt(S.money,1)} Md · niveau ${fmt(S.levelW,1)} m · soutien ${fmt(S.support,0)} % · opinion ${fmt(S.opinion,0)} % · ${fmt(S.power,0)} GW
    </div>
    <div class="choices">${e.o.map((c,i)=>
      `<button onclick="pickChoice(${i})">${c[0]}${c[1]?`<em>${c[1]}</em>`:''}</button>`).join('')}</div>`);
}
window.pickChoice=i=>{
  const e=curDec; if(!e)return;
  curDec=null; hideModal();
  log(`<b style="color:#c9a227;position:static">${e.t}</b> — ${e.o[i][0]}`,'big');
  e.o[i][2]();
  if(!S.ended){ S.speed=speedBefore; setSpeedBtn(); }
  uiDirty=true; refresh();
};
function ambient(){
  const pool=AMBIENT.filter(a=>!S.fired['a_'+a.t] && (!a.y||(S.year>=a.y[0]&&S.year<=a.y[1])) && (!a.c||a.c()));
  if(!pool.length||Math.random()>0.5)return;
  const a=pool[Math.floor(Math.random()*pool.length)];
  S.fired['a_'+a.t]=S.year; log(a.t);
}

/* ---------------------------------------------------------------- TOUR */
function stepYear(){
  if(S.ended)return;
  S.year++;
  const frozen = S.flags.freeze && S.year<S.flags.freeze;

  let build=0;
  for(const p of PROJECTS){
    if(!S.active[p.id]||S.built[p.id])continue;
    const per=p.cost/p.yrs*S.costMul;
    if(S.money-build < per){ if(S.year%4===0)log(`Chantier « ${p.n} » au ralenti : les caisses sont vides.`,'bad'); continue; }
    if(frozen)continue;
    build+=per; S.prog[p.id]+=1/p.yrs;
    if(S.prog[p.id]>=0.999){ S.prog[p.id]=1;S.built[p.id]=true;S.active[p.id]=false;
      log(`Achevé : ${p.n}.`,'good');
      if(p.id==='agr')S.flags.agrY=S.year;
      if(p.id==='sic')log("Le bassin oriental est isolé : il peut désormais descendre seul, bien plus bas que l'occidental.",'good');
    }
  }

  const m0=measure();
  /* Taux d'abaissement (m/an), appliqué en continu par la boucle d'animation */
  if(S.built.gib && !frozen){
    let r=0.95;
    if(!S.built.dard && S.levelW>-45) r*=0.66;
    if(!S.built.suez && S.levelW<-20) r*=0.78;
    r*=clamp(m0.aW/S.area0,0.55,1.05);
    S.rBase=r;
    S.rBaseE=S.built.sic ? 0.95*clamp(m0.aE/S.areaE0,0.5,1.05) : 0;
  } else { S.rBase=0; S.rBaseE=0; }
  applyRates();
  S.levelB = S.built.dard ? 0 : Math.max(S.levelW,-42);

  const m=measure();
  const H=-Math.min(S.levelW,0);
  S.power = 0.592*S.turbine*H*(S.built.gib?1:0)*(S.built.dard?1.06:1)*(S.built.sic?1.12:1)*S.powerMul;

  let inc = 3.0 + S.power*(S.flags.oil?0.16:0.115)*(S.built.grd?1.35:1);
  for(const k in nat) if(nat[k].mem) inc+=nat[k].ct;
  if(S.built.cit) inc+=2.4;
  S.agriYield = S.built.agr ? (S.flags.agrFail? Math.max(0,S.agriYield-0.35) : Math.min(3.2,S.agriYield+0.3)) : 0;
  inc=(inc+S.agriYield)*S.incomeMul;
  const dette = S.year<S.debtUntil ? S.debtService : 0;
  const exp = build+0.4+dette+(S.built.gib?1.1:0)+(S.built.sic?0.7:0)+(S.built.cgo?0.9:0)+S.refugees*0.18+S.deadPorts*0.22;
  S.income=inc; S.spend=exp; S.money+=inc-exp;
  if(S.money<-12) { endGame('faillite'); return; }

  if(S.built.sic){
    S.salW=38*S.vol0W/Math.max(m.vW,S.vol0W*0.35);
    S.salE=38*S.vol0E/Math.max(m.vE,S.vol0E*0.30);
  } else {
    S.salW=38*(S.vol0W+S.vol0E)/Math.max(m.vW+m.vE,(S.vol0W+S.vol0E)*0.35);
    S.salE=S.salW;
  }
  const sal=Math.max(S.salW,S.salE);
  let bT = sal<=38.6?100 : sal<40?lerp(100,62,(sal-38.6)/1.4) : sal<41.5?lerp(62,30,(sal-40)/1.5)
         : sal<43?lerp(30,9,(sal-41.5)/1.5) : Math.max(1,lerp(9,1,(sal-43)/2));
  bT*=clamp(m.aW/S.area0,0.4,1);
  S.biodiv=clamp(S.biodiv+(bT-S.biodiv)*0.16,0,100);

  S.land=m.land; S.saltArea=m.salt;
  S.dust=clamp(m.salt/9000,0,100)*(S.flags.fixation?0.6:1);

  computeStrand();
  let dead=0; const lim=S.built.prt?42:16;
  for(const c of CITIES) if(S.strand[c.n]>lim) dead++;
  S.deadPorts=dead;

  S.refugees += dead*0.045 + (S.dust>25?0.22:0) + (S.built.cgo&&S.year-(S.flags.cgoY||9e9)<20?0.5:0);
  if(S.built.cgo&&!S.flags.cgoY)S.flags.cgoY=S.year;
  S.opinion=clamp(S.opinion+((S.power>25?1.1:0)+(S.built.cit?0.5:0)+(S.money>25?0.3:0)
             -S.deadPorts*0.28-(100-S.biodiv)*0.035-S.refugees*0.08)*0.55,0,100);
  S.support=clamp(S.support+((S.power>40?0.9:0)+(S.opinion>60?0.6:-0.5)-(S.flags.deco?0.6:0)-S.deadPorts*0.14)*0.5,0,100);

  for(const c of CITIES){ const n=nat[c.nat]; if(n&&S.strand[c.n]>lim) n.att-=0.18*c.w; }
  for(const k in nat){ const n=nat[k];
    n.att=clamp(n.att+(S.support>65?0.35:0)+(S.power>60?0.25:0)-(S.biodiv<40?0.4:0)-(S.dust>25?0.3:0),0,100);
    if(n.mem&&n.att<22){ n.mem=false; log(`${n.n} quitte le consortium Atlantropa.`,'bad'); }
  }

  for(const e of COND_EVENTS) if(e.c()) e.fn();
  if(S.year%10===0) log(`— ${S.year} — niveau ${fmt(S.levelW,1)} m · ${fmt(S.power,0)} GW · ${fmt(S.land,0)} km² émergés · salinité ${fmt(Math.max(S.salW,S.salE),1)} g/L · biodiversité ${fmt(S.biodiv,0)} %`,'big');

  if(S.levelW<=-155) endGame('victory');
  else if(S.support<8&&S.built.gib) endGame('abandon');
  else if(S.opinion<6) endGame('revolte');
  else if(S.year>=2140) endGame('siecle');

  updateExposure();
  uiDirty=true;
  if(!S.ended){ ambient(); tryDecision(); }
}

  if(S.ended)return; S.ended=kind; S.speed=0; setSpeedBtn();
  const P=[

   ["Vie marine","Non mentionnée par Sörgel",`${fmt(S.biodiv,0)} % subsistant · ${fmt(Math.max(S.salW,S.salE),1)} g/L`],
   ["Ports","« De nouveaux ports seront bâtis »",`${S.deadPorts} ports échoués sur ${CITIES.length}`],
   ["Niveau atteint","−200 m visés",`${fmt(S.levelW,1)} m (ouest) · ${fmt(S.levelE,1)} m (est)`],
   ["Niveau des océans","Effet non prévu",`−${fmt(Math.abs(S.levelW)*2.3e12/3.6e14,2)} m dans le monde entier`],
   ["Décisions","Le plan n'en prévoyait aucune",`${S.decisions} dossiers tranchés en ${S.year-1930} ans`]
  ];
  const T={
    faillite:["FAILLITE","L'Institut Atlantropa a cessé ses paiements. Les vannes de Gibraltar restent où vous les avez laissées : une mer à demi vidée n'a pas d'entretien, et personne pour la remplir."],
    abandon:["LE CONSORTIUM SE DISSOUT","Les nations riveraines se retirent une à une. Le barrage devient un mur sans propriétaire, la mer un problème sans solution."],
    revolte:["LES PEUPLES DISENT NON","Émeutes du sel de Marseille à Alexandrie. Le Grand Œuvre est arrêté par ceux qu'il devait enrichir."],
    siecle:["DEUX SIÈCLES PLUS TARD","Le chantier de Sörgel a duré plus longtemps que la plupart des États qui l'ont financé. Voici ce qu'il en reste."],
    reflood:["LA RÉINONDATION","Vous avez rouvert Gibraltar. Le débit a dépassé mille fois celui de l'Amazone ; une cataracte de plusieurs centaines de mètres a rempli le bassin en deux ans. Les villes bâties sur les fonds ont disparu en une nuit. C'est ainsi que la Méditerranée s'est remplie il y a 5,3 millions d'années — on appelle cela l'inondation zancléenne. Vous venez de la rejouer."],
    victory:["L'ATLANTROPA EXISTE","Cent cinquante mètres. Le continent que Sörgel avait dessiné à la règle est là, sous vos pieds : une plaine de sel de la taille d'un pays, bordée de ports morts. Vous avez réussi. Reste la question que le plan n'a jamais posée — pour qui ?"]
  }[kind];
  showModal(`
    <div class="kicker">Fin de partie · ${S.year}</div>
    <h2>${T[0]}</h2><p>${T[1]}</p>
    <table class="verdict"><tr><th>Poste</th><th>Ce que promettait Sörgel</th><th>Ce que vous obtenez</th></tr>
    ${P.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
    <p style="font-size:12px;color:#9aa3ad">Herman Sörgel a défendu Atlantropa de 1928 jusqu'à sa mort en 1952, renversé à vélo sur la route de son institut. Le projet n'a jamais reçu le moindre coup de pioche : le nucléaire, la décolonisation et le coût l'ont enterré — pas l'écologie, qui n'existait pas encore comme argument.</p>
    <div class="choices"><button onclick="location.reload()">Recommencer</button></div>`);
}

/* ---------------------------------------------------------------- RENDU */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const off=document.createElement('canvas'); off.width=GW_; off.height=GH_;
const octx=off.getContext('2d'); const img=octx.createImageData(GW_,GH_);
let view={z:1,ox:0,oy:0};

function isoBand(d){ // bandes bathymétriques pour le calque géologique
  if(d<50)return 0; if(d<200)return 1; if(d<500)return 2; if(d<1000)return 3;
  if(d<2000)return 4; if(d<3000)return 5; return 6;
}
const ISO_COL=[[176,214,226],[132,190,213],[96,163,198],[68,133,180],[44,102,155],[27,72,124],[14,45,92]];

function rebuildBase(){
  const d=img.data;
  for(let i=0;i<N;i++){
    const o=i*4, nz=noise[i], sh=shade[i];
    let r,g,b;
    if(isLand[i]){
      const e=elev[i];
      if(layer==='geo'){ r=58;g=62;b=58; }
      else if(layer==='eco'){ r=52;g=56;b=54; }
      else{
        // teinte hypsométrique
        const t=clamp(e/2600,0,1);
        if(t<0.18){ const u=t/0.18; r=lerp(96,124,u); g=lerp(118,133,u); b=lerp(78,84,u); }
        else if(t<0.5){ const u=(t-0.18)/0.32; r=lerp(124,158,u); g=lerp(133,140,u); b=lerp(84,96,u); }
        else if(t<0.8){ const u=(t-0.5)/0.3; r=lerp(158,150,u); g=lerp(140,118,u); b=lerp(96,96,u); }
        else { const u=(t-0.8)/0.2; r=lerp(150,226,u); g=lerp(118,224,u); b=lerp(96,222,u); }
      }
      const s=layer==='terrain'?sh:lerp(1,sh,0.55);
      r*=s; g*=s; b*=s;
      r*=0.97+0.06*Math.abs(nz); g*=0.97+0.06*Math.abs(nz); b*=0.97+0.06*Math.abs(nz);
    } else {
      const bs=basin[i];
      const lv = bs===1?0 : bs===4?S.levelB : bs===3?S.levelE : S.levelW;
      const col=depth[i]+lv;
      if(col>0){
        if(layer==='geo'){ const c=ISO_COL[isoBand(col)]; r=c[0];g=c[1];b=c[2]; }
        else if(layer==='sel'){
          const sal = bs===3?S.salE : bs===2?S.salW : 38;
          const t=clamp((sal-38)/7,0,1);
          r=lerp(66,206,t); g=lerp(150,176,t); b=lerp(190,96,t);
          const t2=clamp(col/2600,0,1); r*=1-0.45*t2; g*=1-0.45*t2; b*=1-0.45*t2;
        } else {
          const t=Math.pow(clamp(col/2600,0,1),.62);
          r=lerp(112,10,t); g=lerp(198,36,t); b=lerp(224,76,t);
          if(col<40){ r=lerp(r,198,.4); g=lerp(g,228,.4); b=lerp(b,214,.32); }
        }
        const s=lerp(1,sh,layer==='geo'?0.12:0.30);
        r*=s; g*=s; b*=s;
      } else {
        const age=expo[i]<0?0:clamp((S.year-expo[i])/22,0,1);
        const evap=clamp(depth[i]/700,0,1);
        const sf=clamp(age*(0.45+0.55*evap),0,1);
        if(layer==='sel'){ r=lerp(120,250,sf); g=lerp(104,246,sf); b=lerp(80,236,sf); }
        else if(layer==='geo'){ r=lerp(150,214,sf); g=lerp(132,206,sf); b=lerp(104,186,sf); }
        else { r=lerp(126,224,sf); g=lerp(107,220,sf); b=lerp(76,206,sf); }
        if(depth[i]+lv>-8){ r=lerp(r,92,.45); g=lerp(g,84,.45); b=lerp(b,66,.45); }
        r*=sh; g*=sh; b*=sh;
        r*=0.95+0.10*Math.abs(nz); g*=0.95+0.10*Math.abs(nz); b*=0.95+0.10*Math.abs(nz);
      }
    }
    d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
  }
  // trait de côte
  const wet=v=>{ if(isLand[v])return 0; const bs=basin[v];
    const lv=bs===1?0:bs===4?S.levelB:bs===3?S.levelE:S.levelW; return depth[v]+lv>0?1:0; };
  for(let y=1;y<GH_-1;y++)for(let x=1;x<GW_-1;x++){
    const i=y*GW_+x, c=wet(i);
    if(c!==wet(i+1)||c!==wet(i+GW_)){ const o=i*4; d[o]*=.55; d[o+1]*=.55; d[o+2]*=.60; }
  }
  octx.putImageData(img,0,0);
  baseDirty=false;
}

let P; // projection courante {dx,dy,sc,k}
function proj(lo,la){ return [P.dx+lon2x(lo)*P.sc, P.dy+lat2y(la)*P.sc]; }
function poly(pts,close){ ctx.beginPath();
  pts.forEach((p,i)=>{ const q=proj(p[0],p[1]); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); });
  if(close)ctx.closePath(); }
function label(txt,lo,la,size,col,align,dy){
  const q=proj(lo,la); ctx.textAlign=align||'center';
  ctx.font=`${size*P.k}px Inter,-apple-system,sans-serif`;
  ctx.lineWidth=3.2*P.k; ctx.strokeStyle='rgba(6,9,12,.9)';
  ctx.strokeText(txt,q[0],q[1]+(dy||0)*P.k);
  ctx.fillStyle=col; ctx.fillText(txt,q[0],q[1]+(dy||0)*P.k);
}

function paint(){
  if(baseDirty) rebuildBase();
  const W=cv.width, H=cv.height, k=devicePixelRatio||1;
  const sc=Math.min(W/MW,H/MH)*view.z;
  P={sc,k,dx:(W-MW*sc)/2+view.ox, dy:(H-MH*sc)/2+view.oy};
  ctx.fillStyle='#05080b'; ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,P.dx,P.dy,MW*sc,MH*sc);
  ctx.lineJoin='round'; ctx.lineCap='round';

  /* --- frontières --- */
  if(showBorders){
    ctx.setLineDash([5*k,3.5*k]); ctx.lineWidth=1.25*k;
    ctx.strokeStyle=layer==='eco'?'rgba(240,232,210,.55)':'rgba(232,227,214,.38)';
    for(const b of BORDERS){ poly(b); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  if(showLabels){
    for(const c of COUNTRIES) label(c[2],c[0],c[1],c[2].length>9?9.5:10.5,'rgba(228,222,206,.72)');
  }

  /* --- calque géologique --- */
  if(layer==='geo'){
    ctx.setLineDash([]);
    for(const f of FAULTS){
      ctx.strokeStyle='rgba(224,110,90,.85)'; ctx.lineWidth=2*k; poly(f.p); ctx.stroke();
      const mid=f.p[Math.floor(f.p.length/2)];
      label(f.n,mid[0],mid[1],9.5,'#e0806e','center',-7);
    }
    for(const e of EVAPORITES) label(e[2],e[0],e[1],10,'rgba(238,222,168,.9)');
    for(const g of GEO_NOTES){
      label(g[2],g[0],g[1],10.5,'rgba(226,236,244,.92)','center',-5);
      label(g[3],g[0],g[1],9.5,'rgba(160,196,220,.9)','center',7);
    }
    for(const v of VOLCANOES){
      const q=proj(v[0],v[1]);
      ctx.beginPath(); ctx.moveTo(q[0],q[1]-5*k); ctx.lineTo(q[0]+4.5*k,q[1]+3.5*k); ctx.lineTo(q[0]-4.5*k,q[1]+3.5*k); ctx.closePath();
      ctx.fillStyle='#d8543c'; ctx.fill(); ctx.strokeStyle='rgba(6,9,12,.9)'; ctx.lineWidth=1.2*k; ctx.stroke();
      label(v[2],v[0],v[1],9,'#f0b3a2','center',15);
    }
    if(S.levelW<-70) label(`Rebond isostatique — ${S.quakes} séisme(s) majeur(s)`,10,41.5,11,'#e0806e');
  }

  /* --- calque économique --- */
  if(layer==='eco'){
    const cut=S.levelW<-60;
    ctx.setLineDash([9*k,6*k]); ctx.lineWidth=2.2*k;
    ctx.strokeStyle=cut?'rgba(200,70,55,.85)':'rgba(120,200,235,.75)';
    poly(SEAROUTE); ctx.stroke(); ctx.setLineDash([]);
    label(cut?"Route Europe–Asie : COUPÉE":"Route Europe–Asie (Gibraltar–Suez)",17.5,33.6,10.5,cut?'#e08b82':'#8fd0ea');
    if(S.built.grd||S.built.gib){
      ctx.strokeStyle='rgba(230,198,90,.5)'; ctx.lineWidth=1.4*k; ctx.setLineDash([3*k,3*k]);
      for(const c of CITIES.filter(c=>c.w>=3)){ poly([[-5.6,36.0],[c.lo,c.la]]); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    for(const r of RESOURCES){
      if(r[2]==="Pétrole"&&S.year<1959)continue;
      const q=proj(r[0],r[1]);
      ctx.beginPath(); ctx.arc(q[0],q[1],3.2*k,0,7);
      ctx.fillStyle='#c9a227'; ctx.fill(); ctx.strokeStyle='rgba(6,9,12,.9)';ctx.lineWidth=1.2*k;ctx.stroke();
      label(r[2],r[0],r[1],9.5,'#e0c98a','center',-7);
    }
    if(S.land>2000){
      label(`Terres gagnées : ${fmt(S.land,0)} km²`,17.5,37.2,12,'#e6c65a');
      label(`dont ${fmt(S.saltArea,0)} km² de croûte de sel`,17.5,36.4,10,'#c8bfa0');
    }
    label(`${S.deadPorts} port(s) échoué(s) · ${fmt(S.power,0)} GW · ${fmt(S.money,1)} Md`,4.5,31.6,11,'#cfd6dd');
  }

  /* --- calque sel --- */
  if(layer==='sel'){
    label(`Bassin occidental — ${fmt(S.salW,1)} g/L`,4.5,39.4,12,'#f0e0c0');
    label(`Bassin oriental — ${fmt(S.salE,1)} g/L`,25.0,34.2,12,'#f0e0c0');
    label(`Croûte d'halite et de gypse : ${fmt(S.saltArea,0)} km²`,17.5,31.0,11,'#e0d8c0');
    if(S.dust>12){
      ctx.strokeStyle=`rgba(224,208,168,${clamp(S.dust/60,.25,.85)})`; ctx.lineWidth=2.4*k;
      const plumes=[[[13.0,44.0],[11.0,46.2]],[[11.0,34.5],[13.5,32.0]],[[19.0,36.0],[21.5,38.6]],[[30.0,33.5],[33.0,35.6]],[[4.0,40.0],[3.0,42.6]]];
      for(const p of plumes){ poly(p); ctx.stroke();
        const q=proj(p[1][0],p[1][1]); ctx.beginPath(); ctx.arc(q[0],q[1],3*k,0,7); ctx.fillStyle='rgba(230,216,180,.8)'; ctx.fill(); }
      label(`Tempêtes de sel — indice ${fmt(S.dust,0)}`,8.0,45.6,11,'#e6d8b0');
    }
  }

  /* --- barrages --- */
  for(const id in DAMS){
    const built=S.built[id], active=S.active[id];
    if(!built&&!active&&id!=='gib')continue;
    ctx.strokeStyle=built?'#e6c65a':(active?'rgba(230,198,90,.55)':'rgba(255,255,255,.18)');
    ctx.lineWidth=(built?4.5:2.5)*k;
    for(const s of DAMS[id]){ poly(s); ctx.stroke(); }
  }
  if(S.built.gib) label("BARRAGE DE GIBRALTAR",-5.6,35.3,11,'#e6c65a');
  if(S.built.sic) label("DIGUE SICILE–TUNISIE",11.8,36.4,10.5,'#e6c65a');
  if(S.built.dard) label("BARRAGE DES DARDANELLES",26.3,40.9,10,'#e6c65a');

  /* --- villes --- */
  const lim=S.built.prt?42:16;
  for(const c of CITIES){
    const q=proj(c.lo,c.la);
    if(q[0]<-80||q[0]>W+80||q[1]<-40||q[1]>H+40)continue;
    const s=S.strand[c.n]||0, dead=s>lim;
    const rad=(layer==='eco'?(1.8+c.w*1.3):(c.w>=3?3.1:2.5))*k;
    ctx.beginPath(); ctx.arc(q[0],q[1],rad,0,7);
    ctx.fillStyle=dead?'#d0553f':(s>3?'#e0b060':'#f0e9d6'); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.75)'; ctx.lineWidth=1.3*k; ctx.stroke();
    if(showLabels&&(sc/k>0.6||c.w>=3)){
      const t=s>1?`${c.n} · ${fmt(s,0)} km`:c.n;
      ctx.textAlign='left'; ctx.font=`500 ${11*k}px Inter,-apple-system,sans-serif`;
      ctx.lineWidth=3.2*k; ctx.strokeStyle='rgba(5,8,11,.9)';
      ctx.strokeText(t,q[0]+rad+3*k,q[1]+3.6*k);
      ctx.fillStyle=dead?'#e39182':'#e8e3d6'; ctx.fillText(t,q[0]+rad+3*k,q[1]+3.6*k);
    }
  }
}

const LEGENDS={
 terrain:`<div><i style="background:#2c6f95"></i>Mer · profondeur</div><div><i style="background:#8a7a5c"></i>Fond émergé (vase)</div><div><i style="background:#ded9c6"></i>Croûte de sel</div><div><i style="background:#7c8a56"></i>Terre · relief ombré</div>`,
 geo:`<div><i style="background:#84bed5"></i>Isobathes 50 / 200 / 500 m…</div><div><i style="background:#0e2d5c"></i>Plaines abyssales</div><div><i style="background:#d8543c"></i>Volcans actifs</div><div><i style="background:#e0806e"></i>Failles et zones de subduction</div><div style="margin-top:4px;color:#8c949e">Les fonds reposent sur 1 à 3 km d'évaporites messiniennes.</div>`,
 eco:`<div><i style="background:#8fd0ea"></i>Route maritime Europe–Asie</div><div><i style="background:#c9a227"></i>Ressources · réseau électrique</div><div><i style="background:#f0e9d6"></i>Port actif</div><div><i style="background:#d0553f"></i>Port échoué</div>`,
 sel:`<div><i style="background:#42a0be"></i>38 g/L</div><div><i style="background:#ce9a60"></i>42 g/L</div><div><i style="background:#e0b060"></i>45 g/L et plus</div><div><i style="background:#faf6ec"></i>Croûte d'halite</div>`
};

function resize(){ const r=cv.parentElement.getBoundingClientRect();
  cv.width=Math.max(2,Math.floor(r.width*devicePixelRatio));
  cv.height=Math.max(2,Math.floor(r.height*devicePixelRatio)); paint(); }
addEventListener('resize',resize);
cv.addEventListener('wheel',e=>{e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12; view.z=clamp(view.z*f,1,8);
  if(view.z<=1.001){view.z=1;view.ox=0;view.oy=0} paint();},{passive:false});
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox:view.ox,oy:view.oy};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;
  view.ox=drag.ox+(e.clientX-drag.x)*devicePixelRatio; view.oy=drag.oy+(e.clientY-drag.y)*devicePixelRatio;
  const bd=baseDirty; baseDirty=false; paint(); baseDirty=bd;});   // pas de recalcul du fond pendant le glisser
addEventListener('pointerup',()=>drag=null);

/* -------------------------------------------------------------- PANNEAUX */
function bar(l,v,max,c,sfx){ const p=clamp(v/max*100,0,100);
  return `<div class="bar"><div class="lab"><span>${l}</span><span>${sfx}</span></div><div class="track"><div class="fill" style="width:${p}%;background:${c}"></div></div></div>`; }

function paneOps(){
  const nMem=Object.values(nat).filter(n=>n.mem).length;
  let h=`<div class="sec">Vannes de Gibraltar</div>`;
  if(S.built.gib){
    h+=`<p style="font-size:11px;color:#9aa3ad;margin:0 0 4px;line-height:1.5">
    Turbiner de l'eau, c'est laisser l'Atlantique compenser l'évaporation : la mer cesse de descendre.
    Mais la puissance vaut <em>débit × hauteur de chute</em> — et la hauteur de chute, c'est justement ce que vous perdez en n'asséchant pas.</p>
    <input id="slider" type="range" min="0" max="100" value="${Math.round(S.turbine*100)}">
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#9aa3ad">
      <span>0 % — assèchement</span><span><b style="color:#e6c65a" id="turbVal">${Math.round(S.turbine*100)} %</b></span><span>100 % — niveau stable</span></div>
    <div style="margin-top:8px;font-size:11.5px">
      Descente : <b id="turbDrop">${fmt(S.dropW,2)} m/an</b> &nbsp;·&nbsp;
      Puissance : <b style="color:#e6c65a" id="turbPow">${fmt(S.power,1)} GW</b></div>`;
  } else h+=`<p style="font-size:11px;color:#9aa3ad">Rien ne commence avant que le détroit ne soit fermé. Il faut l'accord de l'Espagne, du Maroc et du Royaume-Uni.</p>`;

  h+=`<div class="sec">Trésorerie</div><div style="font-size:11.5px;line-height:1.75">
     Recettes <b style="color:#8fd096;float:right">+${fmt(S.income,1)} Md/an</b><br>
     Dépenses <b style="color:#e08b82;float:right">−${fmt(S.spend,1)} Md/an</b><br>
     ${S.year<S.debtUntil?`Service de la dette <b style="color:#e08b82;float:right">−${fmt(S.debtService,1)} Md jusqu'en ${S.debtUntil}</b><br>`:''}
     Consortium <b style="float:right">${nMem} / ${NATIONS.length} nations</b><br>
     Décisions prises <b style="float:right">${S.decisions}</b></div>
   <div class="sec">Chantiers</div>`;
  for(const p of PROJECTS){
    const ok=p.req.every(r=>nat[r].mem);
    const st=S.built[p.id]?`<span class="tag ok">achevé</span>`:S.active[p.id]?`<span class="tag">en cours</span>`
      :ok?`<span class="tag">disponible</span>`:`<span class="tag no">accord manquant</span>`;
    const rq=p.req.length?`<div style="font-size:10px;color:#8c949e;margin-top:4px">Requiert : ${p.req.map(r=>`<span style="color:${nat[r].mem?'#8fd096':'#e08b82'}">${nat[r].n}</span>`).join(', ')}</div>`:'';
    h+=`<div class="card"><div class="row"><h4>${p.n}</h4>${st}</div><p>${p.d}</p>${rq}
      <div class="row" style="margin-top:7px"><span class="cost">${p.cost} Md · ${p.yrs} ans</span>
      ${S.built[p.id]?'':`<button ${ok?'':'disabled'} onclick="toggleProj('${p.id}')">${S.active[p.id]?'Suspendre':'Lancer'}</button>`}</div>
      ${S.prog[p.id]>0?`<div class="prog"><i style="width:${S.prog[p.id]*100}%"></i></div>`:''}</div>`;
  }
  if(S.built.gib&&!S.ended){
    h+=`<div class="sec">Option irréversible</div><div class="card"><h4>Rouvrir le détroit</h4>
      <p>${S.levelW<-55?"L'Institut estime qu'une réinondation produirait une cataracte de type zancléen.":"Il est encore tôt : la remontée serait lente et sans dégât majeur."}</p>
      <button onclick="reflood()" style="border-color:#7d3b31;color:#e8a49b">Ouvrir les vannes</button></div>`;
  }
  return h;
}

   <p style="font-size:11px;color:#9aa3ad;line-height:1.55">Les fonds émergés sèchent en croûte d'halite et de gypse. Le vent la soulève.
   La mer d'Aral, cent fois plus petite, a suffi à empoisonner l'agriculture de deux républiques.</p>
   <div class="sec">Terres & climat</div><div style="font-size:11.5px;line-height:1.85">
     Fonds émergés <b style="float:right">${fmt(S.land,0)} km²</b><br>
     Dont croûte saline <b style="float:right;color:#b9a97e">${fmt(S.saltArea,0)} km²</b><br>
     Rendement agricole <b style="float:right;color:${S.flags.agrFail?'#e08b82':'#8fd096'}">${fmt(S.agriYield,1)} Md/an</b><br>
     Baisse du niveau des océans <b style="float:right">${fmt(Math.abs(S.levelW)*2.3e12/3.6e14,2)} m</b><br>
     Séismes majeurs <b style="float:right">${S.quakes}</b></div>
   <p style="font-size:11px;color:#9aa3ad;line-height:1.55">Retirer l'eau de la Méditerranée abaisse réellement le niveau global des océans — l'unique effet
   que les projets modernes de barrage à Gibraltar retiennent encore.</p>`;
}
function paneGeo(){
  let h=`<div class="sec">Opinion & légitimité</div>
   ${bar('Soutien des gouvernements',S.support,100,'#4a8fb8',fmt(S.support,0)+' %')}
   ${bar('Opinion publique',S.opinion,100,'#8a6fb8',fmt(S.opinion,0)+' %')}
   ${bar('Déplacés',S.refugees,40,'#c0392b',fmt(S.refugees,1)+' M')}
   <div class="sec">Consortium</div>`;
  for(const k in nat){ const n=nat[k];
    const col=n.att>60?'#5a9e5e':n.att>35?'#c9a227':'#c0392b';
    h+=`<div class="card" style="padding:7px 9px"><div class="row">
      <div><h4 style="margin:0">${n.n}</h4><div class="track" style="width:118px;margin-top:5px"><div class="fill" style="width:${n.att}%;background:${col}"></div></div></div>
      <div style="text-align:right">${n.mem?'<span class="tag ok">membre</span>':`<button onclick="negotiate('${k}')" ${S.money<2?'disabled':''}>Négocier · 2 Md</button>`}
      <div style="font-size:10px;color:#8c949e;margin-top:4px">contribution ${n.ct} Md/an</div></div></div></div>`;
  }
  h+=`<div class="sec">Ports</div><div style="font-size:11.5px;line-height:1.8">`;
  const lim=S.built.prt?42:16;
  for(const c of CITIES.slice().sort((a,b)=>(S.strand[b.n]||0)-(S.strand[a.n]||0))){
    const s=S.strand[c.n]||0;
    h+=`<div style="display:flex;justify-content:space-between;color:${s>lim?'#e08b82':'#c3cbd4'}"><span>${c.n}</span><span>${s<1?'à quai':fmt(s,0)+' km de la mer'}</span></div>`;
  }
  return h+'</div>';
}
function paneDoc(){
  return `<div class="sec">Le projet réel</div>
  <p style="font-size:11.5px;line-height:1.65;color:#c3cbd4"><b>Atlantropa</b> (ou <i>Panropa</i>) est le projet de l'architecte munichois
  <b>Herman Sörgel</b> (1885-1952), défendu de 1928 à sa mort. Un barrage hydroélectrique de 35 km au détroit de Gibraltar devait abaisser la
  Méditerranée <b>jusqu'à 200 mètres</b>, en produisant environ <b>50 000 MW</b> et en découvrant des centaines de milliers de km² de terres.
  Quatre autres ouvrages étaient prévus : les <b>Dardanelles</b> (retenir la mer Noire), une digue <b>Sicile–Tunisie</b>, un barrage sur le
  <b>Congo</b> pour créer des mers intérieures africaines et irriguer le Sahara, et des <b>écluses à Suez</b>.</p>
  <div class="sec">Ce que Sörgel voulait</div>
  <p style="font-size:11.5px;line-height:1.65;color:#c3cbd4">Un chantier séculaire contre le chômage, l'énergie sans fin, des terres contre la
  surpopulation — et la fusion de l'Europe et de l'Afrique en un bloc capable de tenir tête à l'Amérique et à une « Pan-Asie ». Le projet était
  <b>pacifiste</b> et <b>pan-européen</b> dans son intention, et franchement <b>colonial</b> dans sa structure : l'Afrique y est un espace vide
  à peupler d'Européens, et aucun pays riverain du sud n'a été consulté. En 1938, Sörgel place une citation de Hitler en exergue d'un de ses
  livres pour se rendre acceptable ; en 1942 le régime lui interdit toute propagande.</p>
  <div class="sec">Ce qui serait arrivé</div>
  <p style="font-size:11.5px;line-height:1.65;color:#c3cbd4">
  • <b>Hypersalinité</b> : le sel reste, l'eau part. De 38 à 43-45 g/L — une crise messinienne artificielle, létale pour l'essentiel de la faune.<br>
  • <b>Croûtes de sel</b> : les fonds découverts sont des dépôts évaporitiques, pas de la terre arable. Le « grenier » aurait été un désert salé,
  avec des tempêtes de poussière saline de type mer d'Aral.<br>
  • <b>Ports morts</b> : Venise, Gênes, Marseille, Alexandrie, Le Pirée à des dizaines puis des centaines de kilomètres du rivage.<br>
  • <b>Climat</b> : moins d'évaporation, donc moins de pluies méditerranéennes ; et l'arrêt de la veine d'eau salée qui plonge à Gibraltar
  perturbe la circulation atlantique — l'inverse du bienfait annoncé.<br>
  • <b>Géologie</b> : ôter des centaines de milliers de milliards de tonnes d'eau provoque un rebond de la croûte et une sismicité accrue.</p>
  <div class="sec">Ce qui l'a tué</div>
  <p style="font-size:11.5px;line-height:1.65;color:#c3cbd4">Ni l'écologie ni la morale : le <b>nucléaire civil</b> (1954) a rendu l'argument
  énergétique caduc, la <b>décolonisation</b> a détruit la prémisse eurafricaine, et le coût était sans commune mesure avec la reconstruction
  d'après-guerre. L'Institut Atlantropa a fermé en 1960.</p>
  <div class="sec">Lecture de la carte</div>
  <p style="font-size:11.5px;line-height:1.65;color:#c3cbd4">Le relief est ombré : en s'asséchant, le fond révèle ses talus, ses canyons et ses
  plaines abyssales. Les frontières sont celles de 1930 (Yougoslavie, Transjordanie, Palestine mandataire, Libye italienne). Les calques
  <b>Géologie</b>, <b>Économie</b> et <b>Sel</b> superposent bathymétrie, volcanisme, routes maritimes, ressources et salinité.</p>
  <div class="sec">Sources</div>
  <p style="font-size:10.5px;line-height:1.6;color:#8c949e">Wikipédia « Atlantropa » · W. Voigt, <i>Atlantropa — Weltenbauen am Mittelmeer</i> (1998) ·
  A. Gall, <i>Das Atlantropa-Projekt</i> (1998) · Atlas Obscura · Cabinet Magazine n°10 · Environment &amp; Society Portal.<br><br>
  La simulation est calibrée sur des ordres de grandeur réels (déficit évaporatoire net ≈ 0,95 m/an, P = ρgQHη, bilan de sel à masse constante).
  Le trait de côte et la bathymétrie sont schématiques : c'est un jeu, pas un SIG.</p>`;
}

let sliderBusy=false;
function refresh(){
  document.getElementById('sYear').textContent=S.year;
  document.getElementById('sMoney').textContent=fmt(S.money,1);
  document.getElementById('sPower').textContent=fmt(S.power,0);
  document.getElementById('sLand').textContent=fmt(S.land,0);
  document.getElementById('sSal').textContent=fmt(Math.max(S.salW,S.salE),1);
  document.getElementById('sRef').textContent=fmt(S.refugees,1);
  document.getElementById('sLevel').textContent=fmt(S.levelW,1)+' m';
  document.getElementById('legend').innerHTML=LEGENDS[layer];
  const act=document.querySelector('#tabs button.on').dataset.tab;
  if(!(act==='ops'&&sliderBusy)){
    const el=document.getElementById('pane-'+act), sc=el.scrollTop;
    el.innerHTML = act==='ops'?paneOps():act==='env'?paneEnv():act==='geo'?paneGeo():paneDoc();
    el.scrollTop=sc;
    const sl=document.getElementById('slider');
    if(sl){
      sl.addEventListener('pointerdown',()=>sliderBusy=true);
      sl.addEventListener('input',e=>{
        S.turbine=+e.target.value/100;
        applyRates();
        const H=-Math.min(S.levelW,0);
        const p=0.592*S.turbine*H*(S.built.gib?1:0)*(S.built.dard?1.06:1)*(S.built.sic?1.12:1);
        document.getElementById('turbVal').textContent=Math.round(S.turbine*100)+' %';
        document.getElementById('turbDrop').textContent=fmt(S.dropW,2)+' m/an';
        document.getElementById('turbPow').textContent=fmt(p,1)+' GW';
      });
    }
  }
  paint();
}
addEventListener('pointerup',()=>{ if(sliderBusy){sliderBusy=false;refresh();} });

window.toggleProj=id=>{ S.active[id]=!S.active[id];
  if(S.active[id])log(`Chantier ouvert : ${PROJECTS.find(p=>p.id===id).n}.`); refresh(); };
window.negotiate=k=>{ if(S.money<2)return; S.money-=2; const n=nat[k];
  n.att=clamp(n.att+12+Math.random()*14-(S.flags.deco&&["MA","TN","DZ","LY","EG","CG"].includes(k)?6:0),0,100);
  if(n.att>=58&&!n.mem){n.mem=true;log(`${n.n} rejoint le consortium Atlantropa.`,'good');}
  else if(!n.mem)log(`Pourparlers avec ${n.n} : progrès, sans signature.`);
  refresh(); };
window.reflood=()=>{
  if(S.levelW>-8){ S.levelW=0;S.levelE=0;S.built.gib=false;S.prog.gib=0;baseDirty=true;
    log("Les vannes sont rouvertes. La mer reprend sa place sans dommage — et le projet meurt dans l'indifférence.",'big');
    endGame('abandon'); return; }
  endGame('reflood');
};
function showModal(html){ document.getElementById('ovm').innerHTML=html; document.getElementById('ov').style.display='flex'; }
function hideModal(){ document.getElementById('ov').style.display='none'; }
window.hideModal=hideModal;
window.startGame=()=>{ hideModal(); S.speed=1; setSpeedBtn(); };

/* --------------------------------------------------------------- BOUCLE */
const SPEEDS=[0,0.035,0.10,0.30];            // années par seconde
const RATE=["en pause","1 an ≈ 29 s","1 an ≈ 10 s","1 an ≈ 3,3 s"];
let last=performance.now(), lastUI=0, lastMap=0;
function setSpeedBtn(){
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.sp===S.speed));
  document.getElementById('rate').textContent=RATE[S.speed];
}
function loop(t){
  const dt=Math.min(0.12,(t-last)/1000); last=t;
  if(S.speed>0&&!S.ended){
    const yrs=dt*SPEEDS[S.speed];
    // le niveau descend en continu, pas par sauts annuels
    if(S.built.gib&&!(S.flags.freeze&&S.year<S.flags.freeze)){
      const before=S.levelW;
      S.levelW=Math.max(-230,S.levelW-S.dropW*yrs);
      if(S.built.sic) S.levelE=Math.max(-300,S.levelE-S.dropE*yrs);
      else S.levelE=S.levelW;
      if(!S.built.dard) S.levelB=Math.max(S.levelW,-42);
      if(before!==S.levelW) baseDirty=true;
    }
    S.frac+=yrs;
    while(S.frac>=1){ S.frac-=1; stepYear(); if(S.ended||curDec)break; }
  }
  if(baseDirty && t-lastMap>300){ lastMap=t; paint(); }
  if(uiDirty && t-lastUI>200){ uiDirty=false; lastUI=t; refresh(); }
  requestAnimationFrame(loop);
}
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.sp;setSpeedBtn();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); document.getElementById('pane-'+b.dataset.tab).classList.add('on'); refresh();});
document.querySelectorAll('#layers button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#layers button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); layer=b.dataset.l; baseDirty=true;
  document.getElementById('legend').innerHTML=LEGENDS[layer]; paint();});
document.getElementById('optBorders').onchange=e=>{showBorders=e.target.checked;paint();};
document.getElementById('optLabels').onchange=e=>{showLabels=e.target.checked;paint();};
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();S.speed=S.speed?0:1;setSpeedBtn();} });

/* ------------------------------------------------------------------ BOOT */
const bm=document.getElementById('bootmsg');
setTimeout(()=>{ bm.textContent="rasterisation des côtes…"; setTimeout(()=>{
  buildGrid();
  bm.textContent="mesure des volumes…";
  setTimeout(()=>{
    const m0=measure(); S.vol0W=m0.vW; S.vol0E=m0.vE; S.area0=m0.aW; S.areaE0=m0.aE;
    computeStrand(true); updateExposure();
    document.getElementById('boot').remove();
    resize(); refresh(); drawLog(); setSpeedBtn();
    log("Munich. L'Institut Atlantropa ouvre ses portes. Herman Sörgel a un plan pour l'Europe : lui donner un continent.",'big');
    showModal(`
      <div class="kicker">1930 · Institut Atlantropa, Munich</div>
      <h2>Le Grand Œuvre</h2>
      <p>Vous dirigez l'institut de Herman Sörgel. Le plan est simple et démesuré : barrer le détroit de Gibraltar,
      abaisser la Méditerranée de <b>200 mètres</b>, en tirer une énergie sans fin et un continent neuf, et souder l'Europe à l'Afrique.</p>
      <p><b>Le nœud du jeu.</b> La puissance d'une turbine vaut <i>débit × hauteur de chute</i>. La hauteur de chute, c'est le vide que vous
      creusez. Pour produire, il faut assécher ; pour assécher, il faut renoncer à produire. Et le sel, lui, ne s'évapore jamais.</p>
      <p><b>Le temps est long — deux siècles.</b> Il s'écoule lentement et s'arrête de lui-même à chaque décision : soixante-dix dossiers
      vous seront soumis, diplomatiques, techniques, financiers, sanitaires, archéologiques. C'est là que se joue la partie, pas dans le
      défilement des années.</p>
      <p style="color:#9aa3ad;font-size:12px">Molette pour zoomer, glisser pour déplacer. <b>Espace</b> met en pause.
      Les calques <b>Géologie</b>, <b>Économie</b> et <b>Sel</b> changent la lecture de la carte.
      L'onglet <b>Dossier</b> contient la documentation historique.</p>
      <div class="choices">
        <button onclick="startGame()">Ouvrir le chantier du siècle</button>
        <button onclick="hideModal()">Regarder la carte d'abord</button>
      </div>`);
    requestAnimationFrame(loop);
  },30);
},30);},40);
</script>
